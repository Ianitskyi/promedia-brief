name: Collect BRIEF source pool

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/sources.json"
      - "scripts/collect.py"
      - ".github/workflows/collect-news.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install feed parser
        run: pip install feedparser
      - name: Collect RSS items
        run: python scripts/collect.py
      - name: Commit refreshed pool
        run: |
          git config user.name "BRIEF Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "Update BRIEF raw news pool"
          git push
