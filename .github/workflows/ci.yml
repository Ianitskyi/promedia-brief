name: CI

on:
  pull_request:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/raw/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: Validate JSON config
        run: for f in config/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Tests (no network, no paid APIs)
        run: python -m pytest -q
