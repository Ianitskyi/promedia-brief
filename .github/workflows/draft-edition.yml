name: Draft BRIEF edition

# Builds the script draft for editorial review. No TTS, no publishing.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD, Kyiv). Empty = today"
        required: false
  schedule:
    - cron: "37 15 * * *"   # ≈18:37 Kyiv in summer time, 17:37 in winter time

permissions:
  contents: write

concurrency:
  group: brief-repo-write
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect latest items
        run: python -m brief collect
      - name: Build draft and fact checks
        run: |
          if [ -n "${{ inputs.date }}" ]; then python -m brief draft --date "${{ inputs.date }}"; else python -m brief draft; fi
      - name: Delete editions older than 7 days
        run: python -m brief prune --keep-days 7
      - name: Commit draft
        run: |
          git config user.name "BRIEF Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/raw editions
          git diff --cached --quiet && exit 0
          git commit -m "Draft BRIEF edition for review"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*5)); done
          exit 1
      - name: Summary
        run: |
          D=$(ls -1d editions/20*/ | tail -1)
          echo "Draft ready for review: https://brief.promedia.report/review.html" >> "$GITHUB_STEP_SUMMARY"
          python -m brief check --date "$(basename "$D")" >> "$GITHUB_STEP_SUMMARY" || true
