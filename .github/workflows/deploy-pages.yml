name: Deploy BRIEF to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Commits pushed by workflows (GITHUB_TOKEN) do not trigger `push`, so drafts and
  # published editions would never reach the site without this.
  workflow_run:
    workflows: ["Draft BRIEF edition", "Approve and render BRIEF edition", "Demo edition (paid voice)"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # on workflow_run: the commit the upstream workflow just pushed

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
