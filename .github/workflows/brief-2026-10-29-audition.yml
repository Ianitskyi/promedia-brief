name: BRIEF 29 October 2026 audio audition

# One-shot private paid voice audition. The trigger path is created only once.
on:
  push:
    branches:
      - feature/spoken-news-and-voice-balance-20261030
    paths:
      - docs/tts/trigger-2026-10-29-audition.txt

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: ElevenLabs private audition
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BRIEF_ALLOW_PAID_TTS: "1"
          BRIEF_MAX_TTS_USD: "0.50"
          BRIEF_ELEVENLABS_MODEL: eleven_v3
          BRIEF_ELEVENLABS_STRESS: "0"
          BRIEF_YEVHEN_TEMPO: "1.0"
          BRIEF_YAROSLAVA_TEMPO: "1.0"
        run: |
          test -n "$ELEVENLABS_API_KEY" || (echo "Missing ELEVENLABS_API_KEY" && exit 1)
          python -m brief.audition --script docs/tts/brief-2026-10-29.json --output audition/brief-2026-10-29.mp3
      - name: Private MP3 and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: BRIEF-2026-10-29-Yevhen-Yaroslava
          path: |
            audition/brief-2026-10-29.mp3
            audition/brief-2026-10-29.json
            docs/tts/brief-2026-10-29.json
          retention-days: 14
